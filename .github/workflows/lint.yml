name: Auto Linter
on:
  push:
    paths: "*.py"


jobs:
  code:
    runs-on: ubuntu-latest

    #this step will automatically clone the code of the current branch into the runner

    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
#this will install the linting tool
      - name: Install Linter
        run: pip install ruff

#this will run the linter
      - name: Check the files for linking
        run: ruff check .
